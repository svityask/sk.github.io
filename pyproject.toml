[project]
name = "osnovit-diy-monitor"
dynamic = ["version"]
description = "Монитор цен Основит — Петрович и Лемана ПРО"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["python", "data", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # длину строк держит ruff format
    "RUF001",  # кириллица в строках — это не опечатка
    "RUF002",
    "RUF003",
    "SIM105",  # try/except/pass читается проще contextlib.suppress
]

[tool.mypy]
python_version = "3.10"
files = ["monitor", "start.py", "tools"]
ignore_missing_imports = true
warn_unused_ignores = true
